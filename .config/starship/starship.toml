# Starship prompt — https://starship.rs/config
# Mostly defaults, which are already good. Tweaks below.

# Projects on the external drive need longer than the 500ms default for a cold
# `git status`. Warm runs are instant, so this only affects the first prompt.
command_timeout = 2000

# Show how long slow commands took (default threshold is 2s)
[cmd_duration]
min_time = 2000

# Trim the path a bit less aggressively than default
[directory]
truncation_length = 4

# Don't need the package-version module noise in every repo
[package]
disabled = true
